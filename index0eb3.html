];

var AllowedKeys = [32, 33, 34, 8, 13, 46, 37, 38, 39, 40, 45, 35, 36];
var CurrentSet = [];
var TA1;

function newGame() {

    GlobalTimer.reset();

    let bucket = shuffleArrayKeys(udalosti);
    let list_length = udalosti.length;
    let max_obtiznost = $(".stars_wrap button").length + 1;

    const step = list_length / max_obtiznost;

    const obtiznost = maxObtiznost();
    const list_size = Math.floor((obtiznost + 1) * step);

    CurrentSet = [];
    let temp = [];

    for (let i = 0; i < list_size; i++) {
        CurrentSet.push(bucket[i]);
        temp.push(udalosti[bucket[i]]);
    }

    TA1.val(temp.join("\n"));

    CurrentSet.sort((a, b) => a - b);
}

function showHelp() {
    popupWindow($("#help").html(), 600, 400);
}

function checkSolution() {
    // -- check if solved correctly
    let userInput = TA1.val().split("\n");
    let correct = true;
    for (let i = 0; i < CurrentSet.length; i++) {
        let left = udalosti[CurrentSet[i]].trim();
        let right = userInput[i].trim();

        if (left !== right) {
            correct = false;
            break;
        }
    }

    return correct;
}

function checkBoard() {
    if (checkSolution()) {
        fin();
    }
}

function gameReload() {
    newGame();
}


$(function () {

    TA1 = $('#mainArea');

    TA1.keyboard({ allowedKeys: AllowedKeys });

    TA1.on('keydown', function () {
        if (!GlobalTimer.isRunning()) {
            GlobalTimer.start();
        }
    });

    TA1.on('input', function () {
        checkBoard();
    });

    $(window).on('resize', function () {

    });

    newGame();
});    </script>
