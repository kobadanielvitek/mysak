        <div class="whiteSpace">
            <h1>16. Typografie - jak vypadá písmo <span id='h1_popis'></span></h1><div class="width group font-setting">
    <nav class="center flex flex-sides font-setting-0">
        <div class="flex font-setting-0">
            <div>
                <strong>SERIF</strong>
                <div class="flex grp">
                    <label>
                        <input type="radio" name="fontSerif[]" data-font="serif" value="serif">Patkové
                    </label>
                    <label>
                        <input type="radio" name="fontSerif[]" data-font="sans" value="sans">Bezpatkové
                    </label>
                </div>
            </div>

            <div>
                <strong>ŘEZ PÍSMA</strong>
                <div class="flex grp">
                    <label>
                        <input name="fontWeight" data-font="bold" type="checkbox" value="b">Tučné
                    </label>
                    <label>
                        <input name="fontStyle" data-font="italic" type="checkbox" value="i">Kurzíva
                    </label>
                </div>
            </div>

            <div>
                <strong>STROJOVÉ</strong>
                <div class="grp">
                    <label>
                        <input type="checkbox" id="fontMonospace" name="fontMonospace" value="1" data-font="monospace">Pevná šířka
                    </label>
                </div>
            </div>

        </div>
        <div>
            <strong>PÍSMO</strong>
            <select name="fontFamily" data-font="font"></select>
        </div>
    </nav>

    <div class="textArea">
        <textarea cols="40" rows="3" wrap="wrap"></textarea>
    </div>

    <div class="textStats">
        <div class="flex">
