    <script>
        /**
 *  Etudy pro klávesnici a myš
 *
 *  BAREVNÉ DVOJICE
 *  v 4.0
 *
 */

const MIN_SIZE = 2;
const MAX_SIZE = 16;

let cols = 16;
let rows = 2;

let tbl = [];
let selected = null;
let tblPuzzle;
let rightCount = 0;
let wrongCount = 0;

function buildBoard() {
    tblPuzzle.html('');
    tbl = [];

    for (let i = 0; i < rows; i++) {
        let row = '';

        for (let j = 0; j < cols; j++) {
            const index = (i * cols) + j;
            row += '<td><a id="m' + index + '"></a></td>';
            tbl[index] = index;
        }

        tblPuzzle.append('<tr>' + row + '</tr>');
    }
}

function createPattern() {
    shuffleArray(tbl);

    for (let i = 0; i < tbl.length; i += 2) {
        const c = random_color();

        tblPuzzle.find('#m' + tbl[i]).css('background-color', c).show();
        tblPuzzle.find('#m' + tbl[i + 1]).css('background-color', c).show();
    }
}

function checkSolution() {
    return tblPuzzle.find('td a:visible').length === 0;
}

function checkSolved() {
    if (checkSolution()) {
        fin();
    }
}

function clampSize(v) {
    return Math.max(MIN_SIZE, Math.min(MAX_SIZE, v));
}

// -- keep rows * cols even so every card has a matching pair
function ensureEvenBoard() {
    if ((rows * cols) % 2 !== 0) {
        cols = cols < MAX_SIZE ? cols + 1 : cols - 1;
    }
}

function updateGridSizeLabel() {
    $('#grid_size').text(cols + ' x ' + rows);
    $('#sumbox').text(rows * cols);
}

function updateScore() {
    drawCanvasText(document.getElementById('right'), String(rightCount));
    window.MYSAK_WRONG = wrongCount; drawCanvasText(document.getElementById('wrong'), String(wrongCount));
}

function newGame() {
    GlobalTimer.reset();
    selected = null;
    rightCount = 0;
    wrongCount = 0;

    // const obtiznost = maxObtiznost();
    // -- wider board per difficulty level, always an even number of cards
    // cols = 4 + (obtiznost * 2);
    // rows = 4;

    updateGridSizeLabel();
    updateScore();
    buildBoard();
    createPattern();
}

function gameReload() {
    newGame();
}

function showHelp() {
    popupWindow($('#help').html(), 500, 300);
}

$(function () {
    tblPuzzle = $('#tblPuzzle');

    tblPuzzle.on('click', 'td a', function () {
        const card = $(this);

        if (card.hasClass('selected')) {
            card.removeClass('selected');
            selected = null;
            return;
        }

        if (!GlobalTimer.isRunning()) {
            GlobalTimer.start();
        }

        card.addClass('selected');

        if (selected === null) {
            selected = card;
            return;
        }

        if (selected.css('background-color') === card.css('background-color')) {
            selected.add(card).hide();
            rightCount++;
        } else {
            wrongCount++;
        }

        updateScore();

        selected.removeClass('selected');
        card.removeClass('selected');
        selected = null;

        checkSolved();
    });

    $('#bottom_navi').on('click', '[data-column]', function () {
        cols = clampSize(cols + Number($(this).data('column')));
        ensureEvenBoard();
        newGame();
    });

    $('#bottom_navi').on('click', '[data-row]', function () {
        rows = clampSize(rows + Number($(this).data('row')));
        ensureEvenBoard();
        newGame();
    });

    newGame();
});
    </script>
