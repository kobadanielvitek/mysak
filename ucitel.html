<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Učitel – přehled PC | MYŠÁK</title>
    <style>
        :root { --bg:#08080d; --card:#17171f; --card2:#20202e; --border:#2e2e44; --text:#e9e9f4; --muted:#a9a9c0; --acc:#2ee6b0; --danger:#ff6b6b; --primary:#8b7cff; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; padding:24px 16px 40px; font-family:"Google Sans","Nunito",system-ui,sans-serif; background:linear-gradient(160deg,#08080d,#12121c 45%,#0a1018); color:var(--text); }
        .wrap { max-width:1000px; margin:0 auto; }
        h1 { text-align:center; color:var(--primary); text-shadow:0 2px 10px rgba(0,0,0,.45); margin-bottom:.3rem; }
        .sub { text-align:center; color:var(--muted); margin-bottom:1.2rem; }
        .toolbar { display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; margin-bottom:1rem; }
        button { padding:.55rem 1rem; border-radius:10px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-weight:700; cursor:pointer; font-family:inherit; }
        button:hover { background:var(--primary); color:#fff; }
        table { width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.5); }
        th, td { padding:.6rem .7rem; text-align:left; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
        th { background:var(--card2); font-weight:800; }
        tr:last-child td { border-bottom:none; }
        .ok { color:var(--acc); font-weight:800; }
        .bad { color:var(--danger); font-weight:800; }
        .empty { text-align:center; color:var(--muted); padding:2rem; }
        .back { display:inline-block; margin-top:1rem; color:var(--primary); text-decoration:none; font-weight:700; }
        footer { text-align:center; color:var(--muted); font-size:.85rem; margin-top:2rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Učitel – přehled PC</h1>
        <p class="sub">Stav počítačů uložených v tomto prohlížeči. Pro sdílení mezi počítači je potřeba Firebase (viz README).</p>
        <div class="toolbar">
            <button id="btn-refresh">Obnovit</button>
            <button id="btn-clear">Smazat vše</button>
            <a href="index.html" style="text-decoration:none;"><button type="button">Zpět do her</button></a>
        </div>
        <table id="tbl">
            <thead>
                <tr>
                    <th>PC</th><th>Hra</th><th>Kliky</th><th>Úspěchy</th><th>Chyby</th><th>Čas</th><th>Aktualizováno</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <p class="empty" id="empty" style="display:none;">Žádné PC zatím neuloženo. Otevři hru, klikni 5× v pravém horním rohu a ulož stav.</p>
        <footer>Vzdělávací, nekomerční účely.</footer>
    </div>
    <script>
        function load() {
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.indexOf("mysak_pc_") === 0 && k !== "mysak_pc_name") keys.push(k);
            }
            keys.sort();
            if (keys.length === 0) {
                document.getElementById("empty").style.display = "block";
                return;
            }
            document.getElementById("empty").style.display = "none";
            keys.forEach(function (k) {
                let rec = null;
                try { rec = JSON.parse(localStorage.getItem(k)); } catch (e) {}
                if (!rec) return;
                const tr = document.createElement("tr");
                tr.innerHTML =
                    "<td><b>" + (rec.pc || k.replace("mysak_pc_","")) + "</b></td>" +
                    "<td>" + (rec.game || "—") + "</td>" +
                    "<td>" + (rec.clicks != null ? rec.clicks : "—") + "</td>" +
                    "<td class='ok'>" + (rec.score != null ? rec.score : "—") + "</td>" +
                    "<td class='bad'>" + (rec.wrong != null ? rec.wrong : "—") + "</td>" +
                    "<td>" + (rec.time || "—") + "</td>" +
                    "<td>" + (rec.updated || "—") + "</td>";
                tbody.appendChild(tr);
            });
        }
        document.getElementById("btn-refresh").addEventListener("click", load);
        document.getElementById("btn-clear").addEventListener("click", function () {
            if (!confirm("Smazat všechny uložené PC?")) return;
            const toDel = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.indexOf("mysak_pc_") === 0) toDel.push(k);
            }
            toDel.forEach(function (k) { localStorage.removeItem(k); });
            load();
        });
        load();
        setInterval(load, 5000);
    </script>
</body>
</html>
