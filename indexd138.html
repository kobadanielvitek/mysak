    <script>/**
 *  MATRIX LIB 
 *  1.0
 */

function getCharsPerLine(textarea) {
    const style = window.getComputedStyle(textarea);
    const paddingLeft = parseFloat(style.paddingLeft) || 0;
    const paddingRight = parseFloat(style.paddingRight) || 0;
    const contentWidth = Math.max(0, textarea.clientWidth - paddingLeft - paddingRight);

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = style.font;

    const latinSample = 'MMMMMMMMMM';
    const kanaSample = 'ｶｶｶｶｶｶｶｶｶｶ';
    const latinWidth = ctx.measureText(latinSample).width / latinSample.length;
    const kanaWidth = ctx.measureText(kanaSample).width / kanaSample.length;
    const charWidth = Math.max(1, latinWidth, kanaWidth);
    const safeWidth = contentWidth * widthSafetyFactor;

    return Math.max(8, Math.floor(safeWidth / charWidth));
}


function getResponsiveCols(cols) {
    if (cols) {
        return Math.max(8, cols);
    }

    const leftEl = $('#leftSide').get(0);
    const rightEl = $('#rightSide').get(0);

    if (!leftEl || !rightEl) {
        return 32;
    }

    const leftCap = getCharsPerLine(leftEl);
    const rightCap = getCharsPerLine(rightEl);
    const safeCols = Math.min(leftCap, rightCap) - 2;

    return Math.max(16, safeCols);
}

function getRowsPerArea(textarea) {
    const style = window.getComputedStyle(textarea);
    const paddingTop = parseFloat(style.paddingTop) || 0;
    const paddingBottom = parseFloat(style.paddingBottom) || 0;
    const lineHeightRaw = parseFloat(style.lineHeight);
    const fontSize = parseFloat(style.fontSize) || 16;
    const lineHeight = Number.isFinite(lineHeightRaw) ? lineHeightRaw : (fontSize * 1.2);
    const contentHeight = Math.max(0, textarea.clientHeight - paddingTop - paddingBottom);
    const safeHeight = contentHeight * rowSafetyFactor;

    return Math.max(4, Math.floor(safeHeight / Math.max(1, lineHeight)));
}

function getResponsiveRows(rows) {
    if (rows) {
        return Math.max(4, rows);
    }

    const leftEl = $('#leftSide').get(0);
    const rightEl = $('#rightSide').get(0);

    if (!leftEl || !rightEl) {
        return defaultRows;
    }

    const leftRows = getRowsPerArea(leftEl);
    const rightRows = getRowsPerArea(rightEl);
    return Math.max(4, Math.min(leftRows, rightRows));
}

function pick(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function randomJapaneseChar() {
    // Matrix-like mix: half-width Katakana + ASCII alnum.
    const ranges = [
        [0xFF66, 0xFF9D], // Half-width Katakana
        [0x0030, 0x0039], // 0-9
        [0x0041, 0x005A]  // A-Z
    ];

    const range = ranges[Math.floor(Math.random() * ranges.length)];
    const code = Math.floor(Math.random() * (range[1] - range[0] + 1)) + range[0];
    const ch = String.fromCharCode(code);

    if (/\s/.test(ch)) {
        return randomJapaneseChar();
    }

    return ch;
}

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function createStreamProfile(rows) {
    const maxLen = Math.max(5, Math.floor(rows * 0.75));
    return {
        head: -randomInt(0, rows),
        length: randomInt(4, maxLen),
        gap: randomInt(1, Math.max(2, Math.floor(rows * 0.3))),
        density: 0.75 + (Math.random() * 0.35)
    };

                 if (y > 100 + Math.random() * 10000) ypos[ind] = 0;
                 else
                     ypos[ind] = y + k;
             });

    <script>
        /**
 *  Etudy pro klávesnici a myš
 * 
 *  TABULE
 *  v 2.0   {07/2026}
 * 
 */

let patternLines = [];
let missionDone = false;
let currentLineLength = 0;
let currentRowCount = 0;
let defaultRows = 10;
const widthSafetyFactor = 0.82;
const rowSafetyFactor = 0.92;

function gameReload() {
    startNewAttempt();
}

function showHelp() {
    popupWindow($("#help").html(), 600, 400);
}

function buildMagicPattern(rows, cols, maxrows) {

    let emptyrows = Math.floor((maxrows - rows) / 2);

    const lines = new Array(rows + emptyrows).fill('');
    const uniqueRows = new Set();
    const activeCols = Math.max(8, Math.floor(cols * 0.8));

    const leftPad = Math.floor((cols - activeCols) / 2);
    const streams = new Array(activeCols).fill(0).map(function () {
        return createStreamProfile(rows);
    });

    for (let r = 0; r < rows; r++) {
        const rowChars = new Array(cols).fill(' ');

        for (let c = 0; c < activeCols; c++) {
            const stream = streams[c];
            const localCol = leftPad + c;

            if (r > stream.head + stream.length + stream.gap) {
                streams[c] = createStreamProfile(rows);
                streams[c].head = r + randomInt(0, 2);
            }

            const distanceFromHead = r - stream.head;
            if (distanceFromHead >= 0 && distanceFromHead < stream.length) {
                const tailFactor = 1 - (distanceFromHead / Math.max(1, stream.length - 1));
                const drawChance = Math.min(0.95, stream.density * (0.45 + (tailFactor * 0.55)));

                if (distanceFromHead === 0 || Math.random() < drawChance) {
                    rowChars[localCol] = randomJapaneseChar();
                }
            }
            else if (Math.random() < 0.03) {
                // Sparse flicker outside active streams keeps the terminal-like texture.
                rowChars[leftPad + c] = randomJapaneseChar();
            }
        }

        let row = rowChars.join('');

        if (uniqueRows.has(row)) {
            const tweakIndex = leftPad + randomInt(0, activeCols - 1);
            rowChars[tweakIndex] = randomJapaneseChar();
            row = rowChars.join('');
        }

        uniqueRows.add(row);
        lines[r + emptyrows] = row;
    }

    return lines;
}

function setPattern(rows, cols) {

    rows = getResponsiveRows(rows);
    cols = getResponsiveCols(cols);

    const difficulty = maxObtiznost() + 1;

    let rows2build = rows;

    if (difficulty < 5) {
        rows2build = difficulty * 3;
    }

    const leftSide = $('#leftSide');
    const rightSide = $('#rightSide');
    const fullCols = Math.max(16, cols + (cols % 2));

    patternLines = buildMagicPattern(rows2build, fullCols, rows);
    missionDone = false;
    currentLineLength = fullCols;
    currentRowCount = rows;

    leftSide.attr('cols', fullCols);
    leftSide.attr('rows', rows);
    rightSide.attr('cols', fullCols);
    rightSide.attr('rows', rows);
    leftSide.val(patternLines.join('\n'));

    leftSide.focus();
    GlobalTimer.reset();

    //$('#missionStatus').text('Mission: copy all lines in reverse order (top -> bottom). Matrix JP mode, active width 80%. Size: ' + rows + 'x' + fullCols + '.');
}

function startNewAttempt() {
    const TA2 = $('#rightSide');

    TA2.val('');
    setPattern();

    requestAnimationFrame(function () {
        TA2.focus();
        TA2.get(0).setSelectionRange(0, 0);
    });
}

/**
 *  Kontrola, zda je opis v pravém poli správně obrácenou kopií vzoru
 *  (přepočítává se vždy z aktuálního obsahu textarey)
 *
 *  @returns {boolean}
 */

function checkSolution() {
    const rightLines = $('#rightSide').val().replace(/\r/g, '').split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);
    const expected = patternLines.slice().reverse()
        .map(line => line.trim())
        .filter(line => line.length > 0);

    if (rightLines.length !== expected.length) {
        return false;
    }

    for (let i = 0; i < expected.length; i++) {
        if (rightLines[i] !== expected[i]) {
            return false;
        }
    }

    return true;
}

function updateMissionState() {

    console.log('Updating mission state.');

    const status = $('#missionStatus');

    if (!checkSolution()) {
        missionDone = false;
        status.text('Mission: copy all lines in reverse order (top -> bottom).');
        return;
    }

    missionDone = true;
    status.text('Mission complete. Reverse copy is correct.');
    fin();
}

function setupKeyboardOnly(TA1, TA2) {
    const textareas = TA1.add(TA2);

    $(document).off('keydown.tabSwitch');

    $(document).on('keydown.tabSwitch', function (event) {
        if (event.key !== 'Tab') {
            return;
        }

        event.preventDefault();
        const active = document.activeElement;

        if (active === TA1.get(0)) {
            TA2.focus();
        }
        else if (active === TA2.get(0)) {
            TA1.focus();
        }
        else {
            TA2.focus();
        }
    });

    textareas.on('keydown', function (event) {
        if (event.key !== 'Tab' && !GlobalTimer.isRunning()) {
            console.log('Starting new attempt due to keyboard input.');
            GlobalTimer.start();
        }

        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'a') {
            event.preventDefault();
            this.select();
        }
    });

    textareas.on('mousedown', function (event) {
        event.preventDefault();
        startNewAttempt();
    });
}

$(function () {

    const TA1 = $('#leftSide');
    const TA2 = $('#rightSide');

    if (!$('#missionStatus').length) {
        //$('#mainBox').after('<p id="missionStatus">Mission: copy all lines in reverse order (top -> bottom).</p>');
    }

    TA1.attr({ spellcheck: false });
    TA2.attr({ spellcheck: false });

    TA2.prop('readonly', false);
    TA1.add(TA2).css({
        'font-family': 'Consolas, "Courier New", monospace',
        'line-height': '1.2',
        'letter-spacing': '0',
        'overflow-x': 'hidden',
        'overflow-y': 'hidden'
    });

    const leftRowsAttr = parseInt(TA1.attr('rows'), 10) || 10;
    const rightRowsAttr = parseInt(TA2.attr('rows'), 10) || 10;

    defaultRows = Math.max(4, Math.min(leftRowsAttr, rightRowsAttr));

    setupKeyboardOnly(TA1, TA2);

    setPattern();

    requestAnimationFrame(function () {
        TA2.focus();
        TA2.get(0).setSelectionRange(0, 0);
    });

    TA2.on('input', function () {
        if (!missionDone) {
            updateMissionState();
        }
    });

    TA2.on('paste', function (event) {
        const original = event.originalEvent;
        const clipboardText = (original && original.clipboardData)
            ? original.clipboardData.getData('text')
            : '';

        /*
            const normalized = clipboardText.replace(/\r/g, '').replace(/\n$/, '');        
            if (normalized.includes('\n')) {
                event.preventDefault();
                $('#missionStatus').text('Paste only one line at a time, in reverse order.');
            }
            */
    });

    $(window).on('resize', function () {
        const responsiveRows = getResponsiveRows();
        const responsiveCols = getResponsiveCols();
        const nextLen = Math.max(16, responsiveCols);

        if (nextLen !== currentLineLength || responsiveRows !== currentRowCount) {
            TA2.val('');
            setPattern();
        }
    });
});    </script>
