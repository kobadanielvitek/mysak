    <script>
    (function () {
        "use strict";
        var elHits = document.getElementById("lbl_hits");
        var elMiss = document.getElementById("lbl_miss");
        var elOk = document.getElementById("box_ok");
        var elBad = document.getElementById("box_bad");
        var elTotal = document.getElementById("lbl_total");
        var elState = document.getElementById("lbl_state");
        var elStatus = document.getElementById("lbl_status");
        var elWord = document.getElementById("type_word");
        var elInput = document.getElementById("type_input");

        var TARGET = 10;
        var score = 0, wrong = 0, won = false, started = false, current = null, used = [];

        var WORDS = ["kočka","pes","slunce","strom","auto","kniha","jablko","ryba","květina","dům","hvězda","kolo","pták","sníh","voda","škola","banán","meloun","žába","klíč","míč","hrad","drak","květ","myš","klávesnice","obrazovka","počítač"];

        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function pickWord() {
            var pool = WORDS.filter(function (w) { return used.indexOf(w) === -1; });
            if (pool.length === 0) { used = []; pool = WORDS.slice(); }
            var w = pool[randInt(0, pool.length - 1)];
            used.push(w);
            return w;
        }

        function newWord() {
            current = pickWord();
            elWord.textContent = current;
            elInput.value = "";
            elInput.className = "type-input";
            elInput.focus();
            elState.textContent = "Napiš slovo.";
        }

        function check() {
            if (!started || won || !current) return;
            var val = elInput.value.trim().toLowerCase();
            if (val === current.toLowerCase()) {
                score++; updateHud();
                elInput.className = "type-input ok";
                if (window.kidSound) window.kidSound.ok();
                elState.textContent = "Správně! ✨";
                if (score >= TARGET) { win(); return; }
                setTimeout(function () { newWord(); }, 400);
            } else {
                wrong++; updateHud();
                elInput.className = "type-input bad";
                if (window.kidSound) window.kidSound.bad();
                elState.textContent = "Špatně – správně je „" + current + "“.";
                setTimeout(function () { newWord(); }, 900);
            }
        }

        function updateHud() {
            elHits.textContent = score; elMiss.textContent = wrong; elOk.textContent = score; elBad.textContent = wrong;
            if (elTotal) elTotal.textContent = "/ " + TARGET;
            window.MYSAK_WRONG = wrong;
        }

        function startGame() {
            if (started) return;
            started = true;
            try { GlobalTimer.start(); } catch (e) {}
            elStatus.textContent = "Piš slova co nejrychleji.";
        }

        document.getElementById("btn_start").addEventListener("click", function () {
            startGame();
            if (won) return;
            if (current) return;
            newWord();
            elState.textContent = "Napiš slovo.";
        });

        elInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                startGame();
                check();
            }
        });

        function win() {
            won = true; updateHud();
            elState.textContent = "Vyhrál jsi! 🎉";
            if (window.kidSound) window.kidSound.win();
            try { GlobalTimer.stop(); } catch (e) {}
            if (typeof fin === "function") fin();
        }

        function checkSolution() { return score >= TARGET; }

        function gameReload() {
            score = 0; wrong = 0; won = false; started = false; current = null; used = [];
            window.MYSAK_WRONG = 0; updateHud();
            elWord.textContent = "kočka"; elInput.value = ""; elInput.className = "type-input";
            elState.textContent = "Klikni na „Start“ a piš slova.";
            elStatus.textContent = "Napiš zobrazené slovo a zmáčkni Enter.";
            try { GlobalTimer.reset(); } catch (e) {}
        }

        function showHelp() {
            if (typeof popupWindow === "function") popupWindow(document.getElementById("help").innerHTML, 430, 300);
        }

        window.checkSolution = checkSolution;
        window.gameReload = gameReload;
        window.showHelp = showHelp;
        window.__current = function () { return current; };
        window.__type = function (w) {
            elInput.value = w;
            check();
        };

        $("#slider_target").slider({
            range: "max", min: 5, max: 25, step: 1, value: TARGET,
            slide: function (event, ui) {
                TARGET = ui.value;
                document.getElementById("lbl_target_val").textContent = ui.value;
                document.getElementById("lbl_total").textContent = "/ " + ui.value;
            },
            stop: function () { gameReload(); }
        });

        updateHud();
        elState.textContent = "Klikni na „Start“ a piš slova.";
    })();
    </script>
