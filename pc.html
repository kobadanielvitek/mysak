    <style>
        /* ==========================================================
           PC - plocha s menu, ve kterém je Windows (virtuální PC)
           ========================================================== */

        html, body { min-height: 100%; }

        .pc-wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 .8rem 1.4rem;
        }

        /* --- horní lišta s menu --- */
        .pc-bar {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
            margin: .2rem auto .9rem;
            padding: .45rem .6rem;
            border-radius: 14px;
            background: linear-gradient(180deg, var(--k-surface-2), var(--k-surface));
            border: 1px solid var(--k-card-border);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
        }

        .pc-logo {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            padding: 0 .5rem 0 .25rem;
            font-weight: 900;
            letter-spacing: .04em;
            text-transform: uppercase;
            font-size: .82rem;
            color: var(--k-muted);
        }

        .pc-btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .42rem .85rem;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--k-text);
            font-weight: 700;
            font-size: .92rem;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s, border-color .15s, transform .1s;
            font-family: inherit;
        }

        .pc-btn:hover { background: var(--k-surface-2); border-color: var(--k-card-border); }
        .pc-btn:active { transform: scale(.97); }

        .pc-btn.win {
            background: var(--kid-primary);
            border-color: var(--kid-primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(139, 124, 255, .4);
        }

        .pc-btn.win:hover { filter: brightness(1.08); background: var(--kid-primary); }

        .pc-spacer { flex: 1; }

        /* --- plocha (obrazovka) --- */
        .pc-screen {
            position: relative;
            width: 100%;
            height: clamp(420px, calc(100vh - 250px), 900px);
            border-radius: 16px;
            border: 1px solid var(--k-card-border);
            background: #14141f;
            box-shadow: 0 22px 60px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(255, 255, 255, .03);
            overflow: hidden;
        }

        .pc-screen iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #14141f;
        }

        /* tapeta, když nic neběží */
        .pc-desktop {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
            padding: 2rem 1.2rem;
            background:
                radial-gradient(circle at 50% 0%, #1d1d30 0%, #0d0d16 70%),
                #0d0d16;
            color: var(--k-text);
        }

        .pc-desktop.off { display: none; }

        .pc-desktop h2 {
            margin: 0;
            font-size: clamp(1.1rem, 3vw, 1.7rem);
            font-weight: 800;
        }

        .pc-desktop p {
            margin: 0;
            max-width: 52ch;
            color: var(--k-muted);
            line-height: 1.5;
        }

        .pc-win-icon {
            width: 64px;
            height: 64px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .pc-win-icon span {
            background: #4aa3ff;
            border-radius: 2px;
        }

        .pc-hint {
            margin: .7rem 0 0;
            text-align: center;
            color: var(--k-muted);
            font-size: .9rem;
            font-weight: 600;
        }

        @media (max-width: 560px) {
            .pc-logo { display: none; }
            .pc-btn { padding: .38rem .6rem; font-size: .85rem; }
        }
    </style>
</head>
<body id="ns__19">
    <header>
        <a href="index.html">
            <strong>Malé etudy pro myš a klávesnici II.</strong>
        </a>
    </header>
    <main>
        <div class="whiteSpace">
            <h1>PC <span id='h1_popis'></span></h1>

            <div class="pc-wrap">

                <nav class="pc-bar" aria-label="Nabídka počítače">
                    <span class="pc-logo">PC</span>
                    <button class="pc-btn win" type="button" id="btn_windows">🪟 Windows</button>
                    <a class="pc-btn" href="index.html">🏠 Hry</a>
                    <a class="pc-btn" href="znak.html">⌨️ Napiš znak</a>
                    <a class="pc-btn" href="klik.html">🎯 Klik na tečku</a>
                    <span class="pc-spacer"></span>
                    <button class="pc-btn" type="button" id="btn_reload">🔄 Načíst znovu</button>
                    <a class="pc-btn" href="https://app.apponfly.com/trial" target="_blank" rel="noopener noreferrer">↗ Nové okno</a>
                </nav>

                <div class="pc-screen" id="screen">

                    <div class="pc-desktop" id="desktop">
                        <div class="pc-win-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                        <h2>Virtuální Windows</h2>
                        <p>Klikni na <strong>Windows</strong> v menu nahoře. Otevře se virtuální počítač s Windows (AppOnFly).</p>
                        <button class="pc-btn win" type="button" id="btn_windows2">🪟 Spustit Windows</button>
                    </div>

                    <iframe id="pc_frame"
                            title="Virtuální Windows – AppOnFly"
                            referrerpolicy="no-referrer-when-downgrade"
                            allow="clipboard-read; clipboard-write; fullscreen"
                            style="display:none;"></iframe>
                </div>

                <p class="pc-hint">Windows se spouští z nabídky nahoře. Pokud se nenačte, otevři ho tlačítkem „Nové okno“.</p>
            </div>
        </div>
    </main>

    <script>
    (function () {
        "use strict";

        var frame = document.getElementById("pc_frame");
        var desktop = document.getElementById("desktop");
        var URL_WIN = "https://app.apponfly.com/trial";

        var timer = null;

        function startWindows() {
            desktop.classList.add("off");
            frame.style.display = "block";

            if (!frame.dataset.loaded) {
                frame.src = URL_WIN;
            } else {
                frame.src = URL_WIN;
            }

            // kdyby server rám zakázal, po 9 s vrátíme plochu s vysvětlením
            clearTimeout(timer);
            timer = setTimeout(function () {
                if (!frame.dataset.loaded) {
                    frame.style.display = "none";
                    desktop.classList.remove("off");
                    desktop.querySelector("h2").textContent = "Rám se nenačetl";
                    desktop.querySelector("p").innerHTML = "AppOnFly nepovoluje zobrazení uvnitř stránky. Otevři ho prosím tlačítkem <strong>Nové okno</strong> v menu.";
                }
            }, 9000);
        }

        frame.addEventListener("load", function () {
            frame.dataset.loaded = "1";
            clearTimeout(timer);
        });

        document.getElementById("btn_windows").addEventListener("click", startWindows);
        document.getElementById("btn_windows2").addEventListener("click", startWindows);

        document.getElementById("btn_reload").addEventListener("click", function () {
            frame.dataset.loaded = "";
            startWindows();
        });
    })();
    </script>

    <script src="js/kids.js?v=17"></script>
</body>
