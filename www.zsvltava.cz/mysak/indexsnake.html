    <style>/**
 *  Cvičení 3 - Klik a dvojklik
 *

.width {
    text-align: center;
    padding: 0 5%;
}

#mainBox {
    display: flex;
    justify-content: center;
    margin-bottom: 1em;
}

#tblPuzzle {
    border-collapse: separate;
    border-spacing: 3px;
    padding: 10px;
    border-radius: 18px;
    border: 4px solid #5b3fa0;
    background: radial-gradient(circle at 30% 20%, #4a3a8f 0%, #2a2260 55%, #1a1440 100%);
    box-shadow: 0 0 0 3px #fff, 0 8px 24px rgba(40, 20, 100, .55), inset 0 0 24px rgba(0, 0, 0, .5);
}

#tblPuzzle.shake {
    animation: board-shake .35s;
}

#tblPuzzle.fresh a {
    animation: cell-appear .45s backwards;
}

#tblPuzzle td {
    width: 2.4em;
    height: 2.4em;
    padding: 0;
    background: transparent;
}

#tblPuzzle td a {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: transform .15s, background .2s, border-radius .2s;
    border-radius: 8px;
    background: rgba(255, 255, 255, .08);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
}

#tblPuzzle td a:hover {
    transform: scale(1.12);
    background: rgba(255, 255, 255, .2);
}

#tblPuzzle td.c0 a {
    background: #710972;
}

#tblPuzzle td.c1 a {
    background: #6e6305;
}

#tblPuzzle td.c0 a.c0 {
    background: #f0f;
    border-radius: 3px;
    box-shadow: 0 0 10px #f0f, inset 0 2px 0 rgba(255, 255, 255, .5);
    animation: cell-pop .35s;
}

#tblPuzzle td.c1 a.c1 {
    background: yellow;
    border-radius: 3px;
    box-shadow: 0 0 10px #ff0, inset 0 2px 0 rgba(255, 255, 255, .6);
    animation: cell-pop .35s;
}

/* ring burst on a correctly colored cell */
#tblPuzzle td a.c0::after,
#tblPuzzle td a.c1::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid #fff;
    pointer-events: none;
    animation: cell-ring .5s ease-out forwards;
}

@keyframes cell-pop {
    0% {
        transform: scale(.4) rotate(-20deg);
    }

    60% {
        transform: scale(1.35) rotate(8deg);
    }

    100% {
        transform: scale(1) rotate(0);
    }
}

@keyframes cell-ring {
    from {
        transform: scale(.6);
        opacity: 1;
    }

    to {
        transform: scale(2.2);
        opacity: 0;
    }
}

@keyframes cell-appear {
    from {
        transform: scale(0);
        opacity: 0;
    }
}

@keyframes board-shake {

    20%,
    60% {
        transform: translateX(-8px);
    }

    40%,
    80% {
        transform: translateX(8px);
    }
}

@media (prefers-reduced-motion: reduce) {

    #tblPuzzle *,
    #tblPuzzle {
        animation: none !important;
    }
}

#bottom_navi {
    padding: 1em 0 2em 0;

}

}

}

    <main>
        <div class="whiteSpace">
            <h1>17. Klik na tečku <span id='h1_popis'></span></h1>
            <div class="width">
                <div id="mainBox" style="display:flex;justify-content:center;">
                    <canvas id="game" width="400" height="400" tabindex="0" style="border-radius:16px; background:#0f0f1a; box-shadow:0 8px 24px rgba(0,0,0,.5); cursor:pointer; outline:none; max-width:100%;"></canvas>
                </div>
                <p class="center" id="lbl_status" style="margin:.6rem 0; font-weight:700;">Klikni na červenou tečku, jakmile se objeví. Cíl: 10 kliků.</p>
                <div class="flex flex-center align-center" id="bottom_navi" style="margin-top:.6rem; gap:.6rem; flex-wrap:wrap;">
                    <div class="stars" data-pocet="5" data-continous="1"></div>
                    <span class="stop_watch" id="lbl_time"></span>
                </div>
                <div id="help" style="display:none;">
                    <div class="center">
                        <h2>Nápověda</h2>
                        <p>Na hrací ploše se objeví <strong>červená tečka</strong>.</p>
                        <p>Klikni na ni co nejrychleji. Pokud nestihneš, ztratíš bod.</p>
                        <p>Cíl: <strong>10 úspěšných kliků</strong>.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="final">
            <div id="finalContent">
                <h1 id="lbl_fin_title">JSI NEJLEPSI</h1>
                <div id="fin_stars"></div>
                <div id="lbl_fin_box">
                    <canvas id="lbl_fin_time" class="time"></canvas>
                </div>
                <div id="fin_score" class="score-board" hidden>
                    <div class="score-right"><canvas id="fin_right"></canvas></div>
                    <div class="score-wrong"><canvas id="fin_wrong"></canvas></div>
                </div>

            </div>

    <script src="js/kids.js?v=6"></script>
    <script>
    (function () {
        "use strict";
        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");
        var statusEl = document.getElementById("lbl_status");

        var TARGET = 10;
        var score = 0;
        var wrong = 0;
        var dot = { x: 0, y: 0, r: 22 };
        var timeoutId = null;
        var started = false;
        var won = false;
        var speed = 1600; // ms per dot

        function placeDot() {
            var margin = dot.r + 8;
            dot.x = margin + Math.random() * (canvas.width - 2 * margin);
            dot.y = margin + Math.random() * (canvas.height - 2 * margin);
        }

        function updateStatus() {
            statusEl.textContent = "Kliky: " + score + " / " + TARGET + "   Chyby: " + wrong;
            window.MYSAK_WRONG = wrong;
        }

        function draw() {
            ctx.fillStyle = "#0f0f1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // dot (red)
            ctx.fillStyle = "#ff3b3b";
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.45)";
            ctx.beginPath();
            ctx.arc(dot.x - 4, dot.y - 4, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function miss() {
            if (won) return;
            wrong++;
            window.MYSAK_WRONG = wrong;
            updateStatus();
            showDot();
        }

        function showDot() {
            if (timeoutId) clearTimeout(timeoutId);
            placeDot();
            draw();
            timeoutId = setTimeout(miss, speed);
        }

        function startGame() {
            if (started) return;
            started = true;
            GlobalTimer.start();
            if (!timeoutId && !won) timeoutId = setTimeout(miss, speed);
        }

        canvas.addEventListener("click", function (e) {
            startGame();
            if (won) return;
            var rect = canvas.getBoundingClientRect();
            var cx = e.clientX - rect.left;
            var cy = e.clientY - rect.top;
            // scale to canvas coords
            cx = cx * (canvas.width / rect.width);
            cy = cy * (canvas.height / rect.height);
            var px = Math.floor(cx), py = Math.floor(cy);
            if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height) {
                wrong++; window.MYSAK_WRONG = wrong; updateStatus(); return;
            }
            // hit = klikl na cerveny pixel (tecku), s malou toleranci 3x3
            var hit = false;
            for (var oy = -1; oy <= 1 && !hit; oy++) {
                for (var ox = -1; ox <= 1 && !hit; ox++) {
                    var nx = px + ox, ny = py + oy;
                    if (nx < 0 || ny < 0 || nx >= canvas.width || ny >= canvas.height) continue;
                    var dd = ctx.getImageData(nx, ny, 1, 1).data;
                    if (dd[0] > 200 && dd[1] < 80 && dd[2] < 80) hit = true;
                }
            }
            if (hit) {
                score++;
                speed = Math.max(600, speed - 60);
                dot.r = Math.max(12, dot.r - 0.6);
                updateStatus();
                if (score >= TARGET && !won) {
                    won = true;
                    if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
                    fin();
                    return;
                }
                showDot();
            } else {
                wrong++;
                window.MYSAK_WRONG = wrong;
                updateStatus();
            }
        });

        function checkSolution() {
            return score >= TARGET;
        }

        function gameReload() {
            if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
            score = 0;
            wrong = 0;
            window.MYSAK_WRONG = 0;
            speed = 1600;
            dot.r = 22;
            won = false;
            started = false;
            placeDot();
            GlobalTimer.reset();
            updateStatus();
            draw();
        }

        function showHelp() {
            if (typeof popupWindow === "function") {
                popupWindow(document.getElementById("help").innerHTML, 420, 300);
            }
        }

        placeDot();
        updateStatus();
        draw();
    })();
    </script>
