    <script>
    (function () {
        "use strict";

        var board = document.getElementById("board");
        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");

        var elHits = document.getElementById("lbl_hits");
        var elMiss = document.getElementById("lbl_miss");
        var elStatus = document.getElementById("lbl_status");

        var W = 600, H = 600, DPR = 1;
        var COLS = 15, ROWS = 15;
        var grid = [];
        var player = { c: 0, r: 0 };
        var steps = 0;
        var bumps = 0;
        var won = false;
        var started = false;

        function generate() {
            grid = [];
            for (var r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (var c = 0; c < COLS; c++) {
                    grid[r][c] = { top: true, right: true, bottom: true, left: true, visited: false };
                }
            }
            var stack = [{ r: 0, c: 0 }];
            grid[0][0].visited = true;
            while (stack.length > 0) {
                var last = stack[stack.length - 1];
                var dirs = [
                    { dr: -1, dc: 0, wall: "top", opp: "bottom" },
                    { dr: 1, dc: 0, wall: "bottom", opp: "top" },
                    { dr: 0, dc: -1, wall: "left", opp: "right" },
                    { dr: 0, dc: 1, wall: "right", opp: "left" }
                ];
                var nbrs = [];
                for (var i = 0; i < dirs.length; i++) {
                    var d = dirs[i];
                    var nr = last.r + d.dr, nc = last.c + d.dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !grid[nr][nc].visited) {
                        nbrs.push({ dir: d, r: nr, c: nc });
                    }
                }
                if (nbrs.length === 0) {
                    stack.pop();
                } else {
                    var pick = nbrs[Math.floor(Math.random() * nbrs.length)];
                    grid[last.r][last.c][pick.dir.wall] = false;
                    grid[pick.r][pick.c][pick.dir.opp] = false;
                    grid[pick.r][pick.c].visited = true;
                    stack.push({ r: pick.r, c: pick.c });
                }
            }
            player.c = 0;
            player.r = 0;
            steps = 0;
            bumps = 0;
            won = false;
            elHits.textContent = 0;
            elMiss.textContent = 0;
            window.MYSAK_WRONG = 0;
        }

        function resize() {
            var rect = board.getBoundingClientRect();
            var cssW = Math.round(rect.width) || 600;
            var cssH = Math.round(rect.height) || cssW;
            W = Math.max(260, cssW);
            H = Math.max(260, cssH);
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            draw();
        }

        function draw() {
            var cell = Math.floor(Math.min(W, H) / (COLS + 1));
            var offX = (W - COLS * cell) / 2;
            var offY = (H - ROWS * cell) / 2;

            ctx.fillStyle = "#0b0b14";
            ctx.fillRect(0, 0, W, H);

            // cesty
            ctx.fillStyle = "#1a1a2e";
            for (var r = 0; r < ROWS; r++) {
                for (var c = 0; c < COLS; c++) {
                    ctx.fillRect(offX + c * cell + 2, offY + r * cell + 2, cell - 4, cell - 4);
                }
            }

            // zdi
            ctx.strokeStyle = "#4a4a6a";
            ctx.lineWidth = 3;
            ctx.lineCap = "square";
            for (var r = 0; r < ROWS; r++) {
                for (var c = 0; c < COLS; c++) {
                    var g = grid[r][c];
                    var x = offX + c * cell;
                    var y = offY + r * cell;
                    if (g.top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cell, y); ctx.stroke(); }
                    if (g.right) { ctx.beginPath(); ctx.moveTo(x + cell, y); ctx.lineTo(x + cell, y + cell); ctx.stroke(); }
                    if (g.bottom) { ctx.beginPath(); ctx.moveTo(x, y + cell); ctx.lineTo(x + cell, y + cell); ctx.stroke(); }
                    if (g.left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cell); ctx.stroke(); }
                }
            }

            // start
            ctx.fillStyle = "rgba(46,230,176,.25)";
            ctx.fillRect(offX + 4, offY + 4, cell - 8, cell - 8);
            ctx.fillStyle = "#2ee6b0";
            ctx.font = "bold 10px Google Sans, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("START", offX + cell / 2, offY + cell / 2);

            // cíl
            ctx.fillStyle = "rgba(139,124,255,.25)";
            ctx.fillRect(offX + (COLS - 1) * cell + 4, offY + (ROWS - 1) * cell + 4, cell - 8, cell - 8);
            ctx.fillStyle = "#8b7cff";
            ctx.fillText("CÍL", offX + (COLS - 0.5) * cell, offY + (ROWS - 0.5) * cell);

            // hráč
            if (!won) {
                ctx.fillStyle = "#ffd166";
                ctx.beginPath();
                ctx.arc(offX + player.c * cell + cell / 2, offY + player.r * cell + cell / 2, Math.max(4, cell * 0.28), 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function tryMove(dr, dc) {
            if (won) return false;
            var r = player.r, c = player.c;
            var nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) { bump(); return false; }
            var g = grid[r][c];
            if (dr === -1 && g.top) { bump(); return false; }
            if (dr === 1 && g.bottom) { bump(); return false; }
            if (dc === -1 && g.left) { bump(); return false; }
            if (dc === 1 && g.right) { bump(); return false; }
            player.r = nr;
            player.c = nc;
            steps++;
            elHits.textContent = steps;
            if (nr === ROWS - 1 && nc === COLS - 1) win();
            draw();
            return true;
        }

        function bump() {
            bumps++;
            elMiss.textContent = bumps;
            window.MYSAK_WRONG = bumps;
            if (window.kidSound) window.kidSound.bad();
            elStatus.textContent = "Náraz do zdi. Nárazy: " + bumps;
        }

        function win() {
            won = true;
            elStatus.textContent = "Vyhrál jsi! 🎉";
            if (window.kidSound) window.kidSound.win();
            try { GlobalTimer.stop(); } catch (e) {}
            if (typeof fin === "function") fin();
        }

        function startGame() {
            if (started) return;
            started = true;
            try { GlobalTimer.start(); } catch (e) {}
            elStatus.textContent = "Použij šipky a dojeď k CÍLI.";
            canvas.focus();
        }

        function gameReload() {
            generate();
            started = false;
            won = false;
            steps = 0;
            bumps = 0;
            window.MYSAK_WRONG = 0;
            elHits.textContent = 0;
            elMiss.textContent = 0;
            elStatus.textContent = "Použij šipky na klávesnici a dojeď k CÍLI.";
            try { GlobalTimer.reset(); } catch (e) {}
            resize();
            draw();
        }

        /* ---------- ovládání ---------- */
        function handleKey(e) {
            if (!started) startGame();
            if (won) return;
            var k = e.key;
            var handled = false;
            if (k === "ArrowUp") { tryMove(-1, 0); handled = true; }
            else if (k === "ArrowDown") { tryMove(1, 0); handled = true; }
            else if (k === "ArrowLeft") { tryMove(0, -1); handled = true; }
            else if (k === "ArrowRight") { tryMove(0, 1); handled = true; }
            if (handled) e.preventDefault();
        }

        document.addEventListener("keydown", handleKey);
        canvas.addEventListener("keydown", handleKey);

        /* ---------- napojení ---------- */
        function checkSolution() { return won; }

        function showHelp() {
            if (typeof popupWindow === "function") {
                popupWindow(document.getElementById("help").innerHTML, 430, 300);
            }
        }

        window.checkSolution = checkSolution;
        window.gameReload = gameReload;
        window.showHelp = showHelp;

        /* ---------- pomocník pro test ---------- */
        window.__move = function (dir) {
            if (!started) startGame();
            if (dir === "up") tryMove(-1, 0);
            else if (dir === "down") tryMove(1, 0);
            else if (dir === "left") tryMove(0, -1);
            else if (dir === "right") tryMove(0, 1);
        };
        window.__atGoal = function () { return player.r === ROWS - 1 && player.c === COLS - 1; };
        window.__grid = function () { return grid; };
        window.__player = function () { return { r: player.r, c: player.c }; };

        generate();
        resize();
        draw();
        window.addEventListener("resize", function () { resize(); });
        if (window.ResizeObserver) {
            try { new ResizeObserver(function () { resize(); }).observe(board); } catch (e) {}
        }
    })();
    </script>
