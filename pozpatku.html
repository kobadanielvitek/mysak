    <script>
    (function () {
        "use strict";
        var elHits = document.getElementById("lbl_hits");
        var elMiss = document.getElementById("lbl_miss");
        var elOk = document.getElementById("box_ok");
        var elBad = document.getElementById("box_bad");
        var elTotal = document.getElementById("lbl_total");
        var elState = document.getElementById("lbl_state");
        var elStatus = document.getElementById("lbl_status");
        var elGrid = document.getElementById("sort_grid");
        var elResult = document.getElementById("sort_result");

        var TARGET = 6;
        var score = 0, wrong = 0, won = false, started = false, lock = false;
        var numbers = [], placed = [], buttons = [], answer = [];

        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function newRound() {
            lock = false; placed = [];
            var n = randInt(4, 6);
            var set = new Set();
            while (set.size < n) set.add(randInt(1, 30));
            numbers = Array.from(set);
            answer = numbers.slice().sort(function (a, b) { return b - a; }); // descending
            var shuffled = numbers.slice();
            for (var i = shuffled.length - 1; i > 0; i--) { var j = randInt(0, i); var t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t; }
            elGrid.innerHTML = ""; buttons = [];
            shuffled.forEach(function (num) {
                var b = document.createElement("button");
                b.type = "button"; b.className = "sort-num"; b.textContent = num;
                b.addEventListener("click", function () { pick(b, num); });
                elGrid.appendChild(b); buttons.push(b);
            });
            renderResult();
            elState.textContent = "Klikej od největšího.";
        }

        function renderResult() {
            elResult.innerHTML = "";
            placed.forEach(function (n) {
                var span = document.createElement("span"); span.textContent = n; elResult.appendChild(span);
            });
            if (placed.length === 0) elResult.textContent = "";
        }

        function pick(btn, num) {
            if (!started || won || lock) return;
            var expected = answer[placed.length];
            if (num === expected) {
                btn.classList.add("used"); btn.classList.add("ok");
                placed.push(num); renderResult();
                if (window.kidSound) window.kidSound.ok();
                if (placed.length === answer.length) {
                    score++; updateHud(); elState.textContent = "Správně! ✨";
                    if (window.kidSound) window.kidSound.win();
                    if (score >= TARGET) { win(); return; }
                    setTimeout(function () { newRound(); }, 800);
                }
            } else {
                btn.classList.add("bad"); wrong++; updateHud();
                if (window.kidSound) window.kidSound.bad();
                elState.textContent = "Špatně – další je " + expected + ".";
                setTimeout(function () { btn.classList.remove("bad"); }, 400);
            }
        }

        function updateHud() {
            elHits.textContent = score; elMiss.textContent = wrong; elOk.textContent = score; elBad.textContent = wrong;
            if (elTotal) elTotal.textContent = "/ " + TARGET;
            window.MYSAK_WRONG = wrong;
        }

        function startGame() {
            if (started) return;
            started = true;
            try { GlobalTimer.start(); } catch (e) {}
            elStatus.textContent = "Klikej od největšího.";
        }

        document.getElementById("btn_start").addEventListener("click", function () {
            startGame();
            if (won) return;
            if (numbers.length) return;
            newRound();
            elState.textContent = "Klikej od největšího.";
        });

        function win() {
            won = true; lock = true; updateHud();
            elState.textContent = "Vyhrál jsi! 🎉";
            if (window.kidSound) window.kidSound.win();
            try { GlobalTimer.stop(); } catch (e) {}
            if (typeof fin === "function") fin();
        }

        function checkSolution() { return score >= TARGET; }

        function gameReload() {
            score = 0; wrong = 0; won = false; started = false; lock = false;
            numbers = []; placed = []; buttons = []; answer = [];
            window.MYSAK_WRONG = 0; updateHud();
            elGrid.innerHTML = ""; elResult.innerHTML = "";
            elState.textContent = "Klikni na „Start“ a počítej pozpátku.";
            elStatus.textContent = "Klikej na čísla sestupně (od největšího).";
            try { GlobalTimer.reset(); } catch (e) {}
        }

        function showHelp() {
            if (typeof popupWindow === "function") popupWindow(document.getElementById("help").innerHTML, 430, 300);
        }

        window.checkSolution = checkSolution;
        window.gameReload = gameReload;
        window.showHelp = showHelp;
        window.__order = function () { return answer.slice(); };
        window.__clickNum = function (n) {
            for (var i = 0; i < buttons.length; i++) {
                if (parseInt(buttons[i].textContent, 10) === n && !buttons[i].classList.contains("used")) { buttons[i].click(); return true; }
            }
            return false;
        };

        $("#slider_target").slider({
            range: "max", min: 3, max: 12, step: 1, value: TARGET,
            slide: function (event, ui) {
                TARGET = ui.value;
                document.getElementById("lbl_target_val").textContent = ui.value;
                document.getElementById("lbl_total").textContent = "/ " + ui.value;
            },
            stop: function () { gameReload(); }
        });

        updateHud();
        elState.textContent = "Klikni na „Start“ a počítej pozpátku.";
    })();
    </script>
