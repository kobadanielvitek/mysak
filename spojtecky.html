            background: linear-gradient(180deg, var(--k-surface-2), var(--k-surface));
            border: 1px solid var(--k-card-border);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .07);
            font-weight: 700;
            font-size: clamp(.95rem, 2vw, 1.12rem);
            letter-spacing: .015em;
            color: var(--k-text);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;

        .kid-hud-item b { font-size: 1.2em; font-weight: 900; }
        #lbl_hits { color: var(--kid-secondary); }
        #lbl_miss { color: var(--kid-danger); }
        .kid-hud-total { opacity: .55; font-weight: 700; }
        .kid-hud-sep { width: 1px; height: 1.35em; background: var(--k-card-border); }

        .kid-hud-boxes { display: inline-flex; gap: .45rem; }
        .kid-hud-box {
            min-width: 2.9rem; height: 2.6rem; padding: 0 .55rem;
            display: grid; place-items: center; border-radius: 13px;
            background: linear-gradient(180deg, var(--k-surface-2), var(--k-surface));
            border: 1px solid var(--k-card-border);
            box-shadow: 0 8px 18px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255,255,255,.07);
            font-weight: 900; font-size: 1.3rem; line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .kid-hud-box.ok { color: var(--kid-secondary); }
        .kid-hud-box.bad { color: var(--kid-danger); }

        .kid-settings {
            display: flex; align-items: center; justify-content: center;

            border: 1px solid var(--k-card-border);

        .kid-setting { display: flex; flex-direction: column; align-items: center; gap: .35rem; min-width: 150px; flex: 1; max-width: 260px; }
        .kid-settings-label { font-weight: 700; color: var(--k-text); }
        .kid-settings-label b { color: var(--kid-primary); }
        .kid-settings .slider { width: 100%; margin: .2rem 0; }

        .kid-board {
            width: 100%;

        .kid-board canvas {

    <main>
        <div class="whiteSpace" id="spojtecky">

                <div class="kid-hud">

    <script src="js/main.js"></script>
    <script src="js/kids.js?v=20"></script>
    <script>
    (function () {
        "use strict";

        var board = document.getElementById("board");
        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");

        var elHits = document.getElementById("lbl_hits");
        var elMiss = document.getElementById("lbl_miss");
        var elOk = document.getElementById("box_ok");
        var elBad = document.getElementById("box_bad");
        var elTotal = document.getElementById("lbl_total");
        var elStatus = document.getElementById("lbl_status");

        var TARGET = 12;
        var score = 0;
        var wrong = 0;
        var won = false;
        var started = false;
        var next = 1;

        var dots = [];
        var lines = [];
        var W = 600, H = 600, DPR = 1;

        /* ---------- rozměry ---------- */
        function resize() {
            var rect = board.getBoundingClientRect();
            var cssW = Math.round(rect.width) || 600;
            var cssH = Math.round(rect.height) || cssW;
            W = Math.max(260, cssW);
            H = Math.max(260, cssH);
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            generate();
            draw();
        }

        /* ---------- generování teček ---------- */
        function generate() {
            dots = [];
            lines = [];
            next = 1;
            score = 0;
            var n = TARGET;
            var minDist = Math.min(W, H) / (Math.sqrt(n) * 1.1);
            var attempts = 0;
            while (dots.length < n && attempts < 2000) {
                attempts++;
                var x = 40 + Math.random() * (W - 80);
                var y = 40 + Math.random() * (H - 80);
                var ok = true;
                for (var i = 0; i < dots.length; i++) {
                    var dx = dots[i].x - x, dy = dots[i].y - y;
                    if (Math.sqrt(dx * dx + dy * dy) < minDist) { ok = false; break; }
                }
                if (ok) dots.push({ x: x, y: y, n: dots.length + 1, hit: false });
            }
            // pokud se nepodařilo vše, doplň náhodně
            while (dots.length < n) {
                dots.push({ x: 40 + Math.random() * (W - 80), y: 40 + Math.random() * (H - 80), n: dots.length + 1, hit: false });
            }
        }

        /* ---------- kreslení ---------- */
        function draw() {
            var size = Math.min(W, H);
            var bg = ctx.createRadialGradient(W / 2, H / 2, size * 0.08, W / 2, H / 2, Math.max(W, H) * 0.8);
            bg.addColorStop(0, "#16162a");
            bg.addColorStop(1, "#07070e");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = "rgba(255,255,255,.035)";
            ctx.lineWidth = 1;
            var step = Math.max(28, Math.round(size / 18));
            for (var gx = step; gx < W; gx += step) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
            for (var gy = step; gy < H; gy += step) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

            // spojnice
            ctx.strokeStyle = "rgba(46,230,176,.7)";
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            for (var i = 0; i < lines.length; i++) {
                var l = lines[i];
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();
            }

            // tečky
            var r = Math.max(16, Math.min(W, H) * 0.042);
            for (var d = 0; d < dots.length; d++) {
                var dot = dots[d];
                var done = dot.hit;
                var isNext = (dot.n === next && !won);

                // halo
                if (isNext) {
                    var halo = ctx.createRadialGradient(dot.x, dot.y, r * 0.3, dot.x, dot.y, r * 2.2);
                    halo.addColorStop(0, "rgba(139,124,255,.45)");
                    halo.addColorStop(1, "rgba(139,124,255,0)");
                    ctx.fillStyle = halo;
                    ctx.beginPath();
                    ctx.arc(dot.x, dot.y, r * 2.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // kruh
                var ball = ctx.createRadialGradient(dot.x - r * 0.3, dot.y - r * 0.3, r * 0.1, dot.x, dot.y, r);
                if (done) {
                    ball.addColorStop(0, "#9affd6");
                    ball.addColorStop(1, "#2ee6b0");
                } else if (isNext) {
                    ball.addColorStop(0, "#b8aeff");
                    ball.addColorStop(1, "#8b7cff");
                } else {
                    ball.addColorStop(0, "#d0d0e0");
                    ball.addColorStop(1, "#6a6a80");
                }
                ctx.fillStyle = ball;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "rgba(255,255,255,.35)";
                ctx.lineWidth = 2;
                ctx.stroke();

                // číslo
                ctx.fillStyle = done ? "#0a3a2a" : "#0b0b14";
                ctx.font = "bold " + Math.round(r * 0.95) + "px Google Sans, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(dot.n, dot.x, dot.y + 1);
            }
        }

        /* ---------- HUD ---------- */
        function updateHud() {
            elHits.textContent = score;
            elMiss.textContent = wrong;
            elOk.textContent = score;
            elBad.textContent = wrong;
            if (elTotal) elTotal.textContent = "/ " + TARGET;
            window.MYSAK_WRONG = wrong;
        }

        /* ---------- hra ---------- */
        function startGame() {
            if (started) return;
            started = true;
            try { GlobalTimer.start(); } catch (e) {}
        }

        canvas.addEventListener("click", function (e) {
            startGame();
            if (won) return;

            var rect = canvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            var x = (e.clientX - rect.left) * (W / rect.width);
            var y = (e.clientY - rect.top) * (H / rect.height);

            // najdi kliknutou tečku
            var r = Math.max(16, Math.min(W, H) * 0.042);
            var tol = r + 6;
            var clicked = null;
            for (var i = 0; i < dots.length; i++) {
                var d = dots[i];
                var dx = x - d.x, dy = y - d.y;
                if (Math.sqrt(dx * dx + dy * dy) <= tol) { clicked = d; break; }
            }
            if (!clicked) return;

            if (clicked.n === next) {
                // správně
                clicked.hit = true;
                // spojnice z předchozí
                if (next > 1) {
                    var prev = null;
                    for (var p = 0; p < dots.length; p++) if (dots[p].n === next - 1) { prev = dots[p]; break; }
                    if (prev) lines.push({ x1: prev.x, y1: prev.y, x2: clicked.x, y2: clicked.y });
                }
                score++;
                next++;
                updateHud();
                if (window.kidSound) window.kidSound.ok();
                if (score >= TARGET) { win(); return; }
                draw();
            } else if (!clicked.hit) {
                // špatná tečka
                wrong++;
                updateHud();
                if (window.kidSound) window.kidSound.bad();
                elStatus.textContent = "Špatná tečka – klikni na " + next + ".";
            }
        });

        function win() {
            won = true;
            updateHud();
            draw();
            if (window.kidSound) window.kidSound.win();
            if (typeof fin === "function") fin();
        }

        /* ---------- napojení ---------- */
        function checkSolution() { return score >= TARGET; }

        function gameReload() {
            score = 0;
            wrong = 0;
            won = false;
            started = false;
            window.MYSAK_WRONG = 0;
            resize();
            updateHud();
            elStatus.textContent = "Klikni na tečku s číslem 1, pak 2, 3… v pořadí.";
            try { GlobalTimer.reset(); } catch (e) {}
        }

        function showHelp() {
            if (typeof popupWindow === "function") {
                popupWindow(document.getElementById("help").innerHTML, 430, 300);
            }
        }

        window.checkSolution = checkSolution;
        window.gameReload = gameReload;
        window.showHelp = showHelp;

        // pomocník pro testování
        window.__clickDot = function (n) {
            for (var i = 0; i < dots.length; i++) {
                if (dots[i].n === n) {
                    var rect = canvas.getBoundingClientRect();
                    canvas.dispatchEvent(new MouseEvent("click", {
                        clientX: rect.left + dots[i].x,
                        clientY: rect.top + dots[i].y,
                        bubbles: true
                    }));
                    return true;
                }
            }
            return false;
        };

        /* ---------- nastavení ---------- */
        $("#slider_target").slider({
            range: "max",
            min: 5,
            max: 30,
            step: 1,
            value: TARGET,
            slide: function (event, ui) {
                TARGET = ui.value;
                document.getElementById("lbl_target_val").textContent = ui.value;
                document.getElementById("lbl_total").textContent = "/ " + ui.value;
            },
            stop: function () { gameReload(); }
        });

        /* ---------- start ---------- */
        resize();
        updateHud();
        draw();

        window.addEventListener("resize", function () { resize(); });
        window.addEventListener("orientationchange", function () {
            setTimeout(function () { resize(); }, 150);
        });

        if (window.ResizeObserver) {
            try { new ResizeObserver(function () { resize(); }).observe(board); } catch (e) {}
        }
    })();
    </script>
