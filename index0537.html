    <script>
        /**
 *  Etudy pro klávesnici a myš
 *
 *  ZNAKOVÁ MOZAIKA I.
 */

const patterns = [
    '     1   1;  22212221222; 2222122212222; 222  1 1  222;      111;      111;   333333333;  33335553333; 3333351533333; 3333355533333; 3333333333333;444444444444444;444444444444444;44           44',
    ';;       1111;22    111111; 2  1111111112222; 2  444444444   2; 2  444444444   2; 2  333333333 22; 2  3333333332; 222444444444;     4444444;      22222;     2222222;    222222222',
    ';;;        3111;       13444;      113;     1113;    11413;   114413 11;  1111113 141; 33333333333333;  122222222221;   1222222221;5555555555555555;',
    ';;   22222222222222;111 111111111111;111123334443332;11 123342Y24332;11  2334Y2Y4332; 11 23342Y24332;  112334Y2Y4332;   12233333332;     22222222;       2222;       2222;',
];

const allowedKeys = [32, 8, 13, 46, 37, 38, 39, 40, 45, 35, 36];
const gridRows = 10;
const initialCrosses = 140;

let shapeArea;
let targetShapes = [];
let solved = false;

function shapeCells(lines) {
    const cells = [];
    const rows = lines.map(function (line) {
        return line.replace(/[0-9Y]/g, 'x');
    });

    rows.forEach(function (line, row) {
        for (let column = 0; column < line.length; column++) {
            if (line[column] !== ' ') {
                cells.push([row, column]);
            }
        }
    });

    const minRow = Math.min.apply(null, cells.map(function (cell) { return cell[0]; }));
    const minColumn = Math.min.apply(null, cells.map(function (cell) { return cell[1]; }));

    return cells.map(function (cell) {
        return (cell[0] - minRow) + ':' + (cell[1] - minColumn);
    }).sort();
}

function parsePattern(pattern) {
    return pattern.split(';');
}

function randomPatternLetters(lines) {
    const letters = {};

    return lines.map(function (line) {
        return line.replace(/[0-9Y]/g, function (token) {
            if (!letters[token]) {
                letters[token] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
            }
            return letters[token];
        });
    }).join('\n');
}

function buildPatterns() {
    targetShapes = [];
    $('#patterns').empty();

    const selectedPatterns = shuffleArrayKeys(patterns).slice(0, 4);

    selectedPatterns.forEach(function (patternIndex) {
        const pattern = patterns[patternIndex];
        const lines = parsePattern(pattern);
        targetShapes.push(shapeCells(lines));
        $('<pre></pre>').text(randomPatternLetters(lines)).appendTo('#patterns');
    });
}

function createGrid() {
    const lines = [];
    let crossesLeft = initialCrosses;

    for (let row = 0; row < gridRows; row++) {
        let line = '';

        for (let column = 0; column < 28; column++) {
            if (crossesLeft > 0 && column % 2 === 0) {
                line += 'x';
                crossesLeft--;
            } else {
                line += ' ';
            }
        }

        lines.push(line);
    }

    shapeArea.val(lines.join('\n'));
}

function currentShape() {
    const lines = shapeArea.val().split('\n');
    const cells = [];

    lines.forEach(function (line, row) {
        for (let column = 0; column < line.length; column++) {
            if (line[column] !== ' ' && line[column] !== '\t') {
                cells.push([row, column]);
            }
        }
    });

    if (!cells.length) {
        return [];
    }

    const minRow = Math.min.apply(null, cells.map(function (cell) { return cell[0]; }));
    const minColumn = Math.min.apply(null, cells.map(function (cell) { return cell[1]; }));

    return cells.map(function (cell) {
        return (cell[0] - minRow) + ':' + (cell[1] - minColumn);
    }).sort();
}

function checkSolution() {
    const current = currentShape();

    return targetShapes.some(function (target) {
        return current.length === target.length && current.every(function (cell, index) {
            return cell === target[index];
        });
    });
}

function checkBoard() {
    if (!solved && checkSolution()) {
        solved = true;
        fin();
    }
}

function newGame() {
    GlobalTimer.reset();
    solved = false;
    buildPatterns();
    createGrid();
}

function gameReload() {
    newGame();
}

function showHelp() {
    popupWindow($('#help').html(), 500, 400);
}

$(function () {
    shapeArea = $('#shape_area');
    shapeArea.keyboard({ allowedKeys: allowedKeys });

    shapeArea.on('keydown', function (event) {
        if (!GlobalTimer.isRunning()) {
            GlobalTimer.start();
        }

        if (event.ctrlKey || event.shiftKey || allowedKeys.indexOf(event.which) < 0) {
            event.preventDefault();
        }
    });

    shapeArea.on('input', checkBoard);
    $('#btnNewShape').click(gameReload);

    newGame();
});
    </script>
