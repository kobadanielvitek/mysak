<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D Klávesnice | MYŠÁK na Vltavě</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; color: #eee; font-family: 'Google Sans', sans-serif; }
        #info {
            position: fixed; top: 10px; left: 10px; z-index: 10;
            background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 10px;
            font-size: 13px; max-width: 340px; backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,.12);
        }
        #info h3 { margin: 0 0 6px; font-size: 15px; }
        #info p { margin: 4px 0; opacity: .85; }
        #info button {
            margin-top: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.1); color: #fff; cursor: pointer; font-family: inherit; font-weight: 700;
        }
        #info button:hover { background: rgba(255,255,255,.2); }
        #hint {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(0,0,0,.5); padding: 6px 14px; border-radius: 999px; font-size: 12px; opacity: .8;
        }
        canvas { display: block; }
        a.back { color: #b8aeff; text-decoration: none; }
    </style>
</head>
<body>
    <div id="info">
        <h3>3D Klávesnice a myš</h3>
        <p>Klikni na libovolnou klávesu nebo tlačítko myši – <b>stiskne se</b>.</p>
        <p id="status">Načítám model…</p>
        <p id="pressed">Stisknuto: —</p>
        <button id="resetCam">Reset kamery</button>
        <button id="clearBind">Vymazat vazby</button>
        <p style="margin-top:8px;font-size:11px;opacity:.6;"><a class="back" href="index.html">← zpět na hry</a></p>
    </div>
    <div id="hint">Táhni myší = otáčení · kolečko = zoom · pravé tlačítko = posun</div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const statusEl = document.getElementById('status');
        const pressedEl = document.getElementById('pressed');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 6, 12);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.01, 100);
        camera.position.set(0, 2.4, 1.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 0.8;
        controls.maxDistance = 6;
        controls.target.set(0, 0.2, 0);

        // lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.45));
        const keyLight = new THREE.DirectionalLight(0xfff2d6, 1.3);
        keyLight.position.set(3, 5, 2);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 20;
        keyLight.shadow.camera.left = -3;
        keyLight.shadow.camera.right = 3;
        keyLight.shadow.camera.top = 3;
        keyLight.shadow.camera.bottom = -3;
        scene.add(keyLight);
        const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
        fill.position.set(-2, 2, -1);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xffd6a8, 0.4);
        rim.position.set(0, 1, -3);
        scene.add(rim);

        // ground plane for shadow
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.ShadowMaterial({ opacity: 0.35 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.6;
        ground.receiveShadow = true;
        scene.add(ground);

        // raycaster
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let root = null;
        const baseY = new Map();   // mesh -> original local Y
        const pressState = new Map(); // mesh -> progress 0..1

        // spárování fyzických kláves s 3D klávesami
        const BIND_KEY = 'mysak3d_bindings';
        let bindings = {};
        try { bindings = JSON.parse(localStorage.getItem(BIND_KEY) || '{}'); } catch (e) { bindings = {}; }
        let pendingKey = null;

        const loader = new GLTFLoader();
        loader.load('models/mouse_and_keyboard.glb', (gltf) => {
            root = gltf.scene;
            // normalize
            const box = new THREE.Box3().setFromObject(root);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            root.position.sub(center);
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 1.6 / maxDim;
            root.scale.setScalar(scale);
            // lift a bit
            root.position.y += 0.15;

            root.traverse((o) => {
                if (o.isMesh) {
                    o.castShadow = true;
                    o.receiveShadow = true;
                    baseY.set(o, o.position.y);
                    // enable click on all meshes
                    o.userData.clickable = true;
                }
            });
            scene.add(root);
            statusEl.textContent = 'Model načten. Klikni na klávesu myší, nebo stiskni klávesu na klávesnici a spáruj ji kliknutím na 3D klávesu.';
            window.__keyPositions = function () {
                const out = [];
                baseY.forEach((_, mesh) => {
                    if (!/keycap|space|mouse_click|mouse_wheel/i.test(mesh.name)) return;
                    const box = new THREE.Box3().setFromObject(mesh);
                    const _tc = new THREE.Vector3((box.min.x+box.max.x)/2, box.max.y, (box.min.z+box.max.z)/2);
                    _tc.applyMatrix4(mesh.matrixWorld);
                    const v = _tc.clone().project(camera);
                    out.push({ name: mesh.name, x: (v.x*0.5+0.5)*window.innerWidth, y: (-v.y*0.5+0.5)*window.innerHeight });
                });
                return out;
            };
        }, (xhr) => {
            if (xhr.lengthComputable) {
                statusEl.textContent = 'Načítám model… ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
            }
        }, (err) => {
            statusEl.textContent = 'Chyba načítání modelu: ' + err;
            console.error(err);
        });

        function pressMesh(mesh) {
            if (!mesh) return;
            pressState.set(mesh, 1);
            const name = mesh.name || 'klávesa';
            pressedEl.textContent = 'Stisknuto: ' + name;
        }

        renderer.domElement.addEventListener('click', (e) => {
            if (!root) return;
            let target = null, bestDist = 60;
            baseY.forEach((_, mesh) => {
                if (!/keycap|space|mouse_click|mouse_wheel/i.test(mesh.name)) return;
                const box = new THREE.Box3().setFromObject(mesh);
                const _tc = new THREE.Vector3((box.min.x+box.max.x)/2, box.max.y, (box.min.z+box.max.z)/2);
                _tc.applyMatrix4(mesh.matrixWorld);
                const v = _tc.clone().project(camera);
                const sx = (v.x * 0.5 + 0.5) * window.innerWidth;
                const sy = (-v.y * 0.5 + 0.5) * window.innerHeight;
                const d = Math.hypot(sx - e.clientX, sy - e.clientY);
                if (d < bestDist) { bestDist = d; target = mesh; }
            });
            if (!target) return;
            if (pendingKey) {
                // bind
                bindings[pendingKey] = target.name;
                try { localStorage.setItem(BIND_KEY, JSON.stringify(bindings)); } catch (e) {}
                statusEl.textContent = 'Spárováno: "' + pendingKey + '" → ' + target.name + '. (' + Object.keys(bindings).length + ' vazeb)';
                pendingKey = null;
                pressMesh(target);
            } else {
                pressMesh(target);
            }
        });

        // fyzická klávesnice -> 3D stisk
        function findMeshByName(name) {
            let found = null;
            baseY.forEach((_, mesh) => { if (mesh.name === name) found = mesh; });
            return found;
        }
        document.addEventListener('keydown', (e) => {
            if (!root) return;
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            const key = e.key;
            if (key === 'Shift' || key === 'Control' || key === 'Alt' || key === 'Meta' || key === 'CapsLock' || key === 'Tab' || key === 'Escape') return;
            const label = (key === ' ') ? 'Space' : key;
            if (bindings[key]) {
                const m = findMeshByName(bindings[key]);
                if (m) pressMesh(m);
            } else if (bindings[label]) {
                const m = findMeshByName(bindings[label]);
                if (m) pressMesh(m);
            } else {
                pendingKey = key;
                statusEl.textContent = 'Nespárováno: "' + key + '". Klikni na odpovídající 3D klávesu pro spárování. (' + Object.keys(bindings).length + ' vazeb)';
            }
        });
        document.getElementById('clearBind').addEventListener('click', () => {
            bindings = {};
            try { localStorage.removeItem(BIND_KEY); } catch (e) {}
            pendingKey = null;
            statusEl.textContent = 'Vazby vymazány. Stiskni klávesu a spáruj ji kliknutím na 3D klávesu.';
        });
        document.getElementById('resetCam').addEventListener('click', () => {
            camera.position.set(0, 2.4, 1.0);
            controls.target.set(0, 0.2, 0);
            controls.update();
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            // decay press animations
            pressState.forEach((prog, mesh) => {
                const newY = baseY.get(mesh) - 0.018 * prog;
                mesh.position.y = newY;
                const next = prog - delta * 6;
                if (next <= 0) {
                    mesh.position.y = baseY.get(mesh);
                    pressState.delete(mesh);
                } else {
                    pressState.set(mesh, next);
                }
            });
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
