    <style>/**
 *  Cvičení 14 - RGB mixér
 */

.whiteSpace {
    padding-bottom: 3em;
}

.rgb-mixer {
    width: min(90vw, 760px);
    margin: 0 auto;
}

.rgb-panels {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.5em;
    margin-bottom: 2em;
}

.rgb-panel-wrap {
    text-align: center;
}

.rgb-panel-wrap h2 {
    margin: 0 0 .6em;
    font-size: 1.2em;
}

.rgb-panel {
    aspect-ratio: 1.8;
    min-height: 10em;
    border: 3px solid #1c1c1c;
    border-radius: 8px;
    box-shadow: inset 0 0 0 1px #fff, 0 3px 8px #0004;
}

.rgb-panel-wrap output {
    display: block;
    margin-top: .6em;
    font-family: monospace;
    font-size: 1.1em;
}

.rgb-controls {
    display: grid;
    grid-template-columns: 7em minmax(0, 1fr) 3em;
    align-items: center;
    gap: .8em 1em;
    margin: 0 auto 2em;
    max-width: 620px;
}

.rgb-reload {
    margin: -1em 0 1.5em;
}

.rgb-controls label {
    font-weight: 700;
}

.rgb-controls label output {
    float: right;
    font-family: monospace;
    font-weight: 400;
}

.rgb-controls input {
    grid-column: 1 / -1;
    width: 100%;
    margin-top: -.55em;
}

.rgb-mixer>.stars {
    justify-content: center;
}

@media (max-width: 600px) {
    .rgb-panels {
        gap: .7em;
    }

    .rgb-panel {
        min-height: 7em;
    }

    .rgb-panel-wrap h2 {
        font-size: 1em;
    }

    .rgb-panel-wrap output {
        font-size: .8em;
    }
}</style>

    <script>
        /**
 *  Etudy pro klávesnici a myš
 *
 *  RGB MIXÉR
 */

let targetColor = [];
let currentColor = [0, 0, 0];
let solved = false;

const tolerances = [0, 20, 10, 3];

function colorText(color) {
    return 'rgb(' + color.join(', ') + ')';
}

function updateColor() {
    const color = colorText(currentColor);

    $('#current_color').css('background-color', color);
    $('#current_rgb').text(color);

    $('#value_red').text(currentColor[0]);
    $('#value_green').text(currentColor[1]);
    $('#value_blue').text(currentColor[2]);
}

function updateTarget() {
    const color = colorText(targetColor);

    $('#target_color').css('background-color', color);
    $('#target_rgb').text(color);
    $('#target_rgb').toggle(maxObtiznost() === 0);
}

function isColorMatch() {
    const tolerance = tolerances[maxObtiznost()];

    return currentColor.every(function (value, index) {
        return Math.abs(value - targetColor[index]) <= tolerance;
    });
}

function checkSolved() {
    if (!solved && isColorMatch()) {
        solved = true;
        fin();
    }
}

function newTarget() {
    targetColor = [
        Math.floor(Math.random() * 256),
        Math.floor(Math.random() * 256),
        Math.floor(Math.random() * 256)
    ];
}

function newGame() {
    GlobalTimer.reset();
    solved = false;
    currentColor = [0, 0, 0];

    $('#slider_red, #slider_green, #slider_blue').val(0);
    newTarget();
    updateColor();
    updateTarget();
}

function gameReload() {
    newGame();
}

function showHelp() {
    popupWindow($('#help').html(), 500, 300);
}

$(function () {
    const sliders = [
        { id: '#slider_red', index: 0 },
        { id: '#slider_green', index: 1 },
        { id: '#slider_blue', index: 2 }
    ];

    sliders.forEach(function (slider) {
        $(slider.id).on('input change', function () {
            if (solved) {
                return;
            }

            if (!GlobalTimer.isRunning()) {
                GlobalTimer.start();
            }

            currentColor[slider.index] = Number($(this).val());
            updateColor();
            checkSolved();
        });
    });

    $('#btnNewColor').click(gameReload);

    newGame();
});
    </script>
