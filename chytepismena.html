        .kid-wrap {

        .kid-hud-bar {

            align-items: center;
            gap: .7rem;
            padding: .5rem 1.1rem;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--k-surface-2), var(--k-surface));
            border: 1px solid var(--k-card-border);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .07);
            font-weight: 700;
            font-size: clamp(.95rem, 2vw, 1.12rem);
            letter-spacing: .015em;
            color: var(--k-text);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .kid-hud-item b { font-size: 1.2em; font-weight: 900; }
        #lbl_hits { color: var(--kid-secondary); }
        #lbl_miss { color: var(--kid-danger); }
        .kid-hud-total { opacity: .55; font-weight: 700; }
        .kid-hud-sep { width: 1px; height: 1.35em; background: var(--k-card-border); }

        .kid-hud-boxes { display: inline-flex; gap: .45rem; }
        .kid-hud-box {
            min-width: 2.9rem; height: 2.6rem; padding: 0 .55rem;
            display: grid; place-items: center; border-radius: 13px;
            background: linear-gradient(180deg, var(--k-surface-2), var(--k-surface));
            border: 1px solid var(--k-card-border);
            box-shadow: 0 8px 18px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255,255,255,.07);
            font-weight: 900; font-size: 1.3rem; line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .kid-hud-box.ok { color: var(--kid-secondary); }
        .kid-hud-box.bad { color: var(--kid-danger); }

        .kid-settings {
            display: flex; align-items: center; justify-content: center;
            gap: 1.2rem; flex-wrap: wrap;
            margin: 0 auto .9rem;
            padding: .6rem 1rem; border-radius: 18px;
            background: linear-gradient(180deg, var(--k-surface-2), var(--k-surface));
            border: 1px solid var(--k-card-border);
            box-shadow: 0 6px 16px rgba(0,0,0,.35);
            font-size: clamp(.85rem, 1.8vw, 1rem);
        }
        .kid-setting { display: flex; flex-direction: column; align-items: center; gap: .35rem; min-width: 150px; flex: 1; max-width: 260px; }
        .kid-settings-label { font-weight: 700; color: var(--k-text); }
        .kid-settings-label b { color: var(--kid-primary); }
        .kid-settings .slider { width: 100%; margin: .2rem 0; }

        .kid-board {
            width: 100%;
            max-width: min(96vw, max(320px, calc(100vh - 200px)), 920px);
            margin: 0 auto;
            aspect-ratio: 1 / 1;
        }

        .kid-board canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 22px;
            background: #0b0b14;
            box-shadow: 0 20px 55px rgba(0, 0, 0, .62), 0 0 0 1px var(--k-card-border);

    <main>
        <div class="whiteSpace" id="chytepismena">
            <h1>23. Chytej písmena <span id='h1_popis'></span></h1>

            <div class="kid-wrap">

                <div class="kid-hud">
                    <div class="kid-hud-bar" aria-live="polite">
                        <span class="kid-hud-item">Chyceno: <b id="lbl_hits">0</b> <span class="kid-hud-total" id="lbl_total">/ 20</span></span>
                        <span class="kid-hud-sep" aria-hidden="true"></span>

                        <div class="slider" id="slider_target"></div>
                    </div>
                    <div class="kid-setting">
                        <span class="kid-settings-label">Rychlost: <b id="lbl_speed_val">Střední</b></span>
                        <div class="slider" id="slider_speed"></div>
                    </div>
                </div>

                <div class="kid-board" id="board">
                    <canvas id="game" width="600" height="600" tabindex="0" aria-label="Chytej písmena"></canvas>
                </div>

                <p class="kid-tip" id="lbl_status">Zmáčkni klávesu, než písmeno spadne dolů.</p>

                <div id="help" style="display:none;">
                    <div class="center">
                        <h2>Nápověda</h2>
                        <p>Písmena padají zhora dolů.</p>
                        <p>Zmáčkni klávesu se stejným písmenem, než spadne.</p>
                        <p>Když spadne, přibude chyba.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="final">
            <div id="finalContent">

                <div id="fin_stars"></div>

    <script src="js/main.js"></script>
    <script src="js/kids.js?v=23"></script>
    <script>
    (function () {
        "use strict";

        var board = document.getElementById("board");
        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");

        var elHits = document.getElementById("lbl_hits");
        var elMiss = document.getElementById("lbl_miss");
        var elOk = document.getElementById("box_ok");
        var elBad = document.getElementById("box_bad");
        var elTotal = document.getElementById("lbl_total");
        var elStatus = document.getElementById("lbl_status");

        var TARGET = 20;
        var SPEED = 2; // 1/2/3
        var score = 0;
        var wrong = 0;
        var won = false;
        var started = false;

        var letters = [];
        var W = 600, H = 600, DPR = 1;
        var lastSpawn = 0;
        var raf = null;

        var POOL = "abcdefghijklmnopqrstuvwxyzáčďéěíňóřšťúůýž";

        function speedPx() {
            var base = 1.2 + SPEED * 0.9;
            try {
                if (typeof STARS === "object" && STARS && STARS.stars) {
                    var d = Math.max(1, STARS.stars("max"));
                    base *= (1 + (d - 1) * 0.08);
                }
            } catch (e) {}
            return base;
        }

        function resize() {
            var rect = board.getBoundingClientRect();
            var cssW = Math.round(rect.width) || 600;
            var cssH = Math.round(rect.height) || cssW;
            W = Math.max(260, cssW);
            H = Math.max(260, cssH);
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            draw();
        }

        function spawn() {
            var ch = POOL.charAt(Math.floor(Math.random() * POOL.length));
            letters.push({
                ch: ch,
                x: 40 + Math.random() * (W - 80),
                y: -30,
                vy: speedPx() + Math.random() * 0.6
            });
        }

        function draw() {
            var bg = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, Math.max(W, H) * 0.8);
            bg.addColorStop(0, "#16162a");
            bg.addColorStop(1, "#07070e");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // spodní čára (země)
            ctx.strokeStyle = "rgba(255,107,107,.5)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, H - 4);
            ctx.lineTo(W, H - 4);
            ctx.stroke();

            ctx.font = "bold " + Math.round(Math.min(W, H) * 0.07) + "px Google Sans, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (var i = 0; i < letters.length; i++) {
                var L = letters[i];
                // stín
                ctx.fillStyle = "rgba(0,0,0,.4)";
                ctx.fillText(L.ch, L.x + 3, L.y + 3);
                // písmeno
                var g = ctx.createRadialGradient(L.x - 6, L.y - 6, 2, L.x, L.y, 22);
                g.addColorStop(0, "#b8aeff");
                g.addColorStop(1, "#8b7cff");
                ctx.fillStyle = g;
                ctx.fillText(L.ch, L.x, L.y);
            }
        }

        function tick() {
            if (won) return;
            var now = performance.now();
            // spawn každých ~1.1 s, max 6 písmen na obrazovce
            if (now - lastSpawn > 1100 && letters.length < 6) {
                spawn();
                lastSpawn = now;
            }

            // pohyb
            for (var i = letters.length - 1; i >= 0; i--) {
                letters[i].y += letters[i].vy;
                if (letters[i].y > H - 10) {
                    // spadlo = chyba
                    letters.splice(i, 1);
                    wrong++;
                    updateHud();
                    if (window.kidSound) window.kidSound.bad();
                    elStatus.textContent = "Spadlo! Chyby: " + wrong;
                }
            }
            draw();
            if (score >= TARGET) { win(); return; }
            raf = requestAnimationFrame(tick);
        }

        /* ---------- HUD ---------- */
        function updateHud() {
            elHits.textContent = score;
            elMiss.textContent = wrong;
            elOk.textContent = score;
            elBad.textContent = wrong;
            if (elTotal) elTotal.textContent = "/ " + TARGET;
            window.MYSAK_WRONG = wrong;
        }

        /* ---------- klávesnice ---------- */
        document.addEventListener("keydown", function (e) {
            if (won) return;
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            if (!e.key || e.key.length !== 1) return;
            if (!started) {
                started = true;
                try { GlobalTimer.start(); } catch (err) {}
                lastSpawn = performance.now();
                raf = requestAnimationFrame(tick);
            }
            e.preventDefault();

            var key = e.key.toLowerCase();
            // najdi nejnižší padající písmeno se shodou
            var idx = -1;
            var maxY = -1;
            for (var i = 0; i < letters.length; i++) {
                if (letters[i].ch.toLowerCase() === key && letters[i].y > maxY) {
                    maxY = letters[i].y;
                    idx = i;
                }
            }
            if (idx >= 0) {
                letters.splice(idx, 1);
                score++;
                updateHud();
                if (window.kidSound) window.kidSound.ok();
                elStatus.textContent = "Chyceno! " + score + " / " + TARGET;
                if (score >= TARGET) win();
            } else {
                wrong++;
                updateHud();
                if (window.kidSound) window.kidSound.bad();
                elStatus.textContent = "Špatná klávesa. Chyby: " + wrong;
            }
        });

        function win() {
            won = true;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            updateHud();
            draw();
            if (window.kidSound) window.kidSound.win();
            if (typeof fin === "function") fin();
        }

        /* ---------- napojení ---------- */
        function checkSolution() { return score >= TARGET; }

        function gameReload() {
            if (raf) { cancelAnimationFrame(raf); raf = null; }
            score = 0;
            wrong = 0;
            won = false;
            started = false;
            letters = [];
            lastSpawn = 0;
            window.MYSAK_WRONG = 0;
            updateHud();
            elStatus.textContent = "Zmáčkni klávesu, než písmeno spadne dolů.";
            resize();
            draw();
            try { GlobalTimer.reset(); } catch (e) {}
        }

        function showHelp() {
            if (typeof popupWindow === "function") {
                popupWindow(document.getElementById("help").innerHTML, 430, 300);
            }
        }

        window.checkSolution = checkSolution;
        window.gameReload = gameReload;
        window.showHelp = showHelp;

        window.__pressFirst = function () {
            if (letters.length === 0) return null;
            var L = letters.reduce(function (a, b) { return (b.y > a.y) ? b : a; }, letters[0]);
            document.dispatchEvent(new KeyboardEvent("keydown", { key: L.ch, bubbles: true }));
            return L.ch;
        };

        /* ---------- nastavení ---------- */
        $("#slider_target").slider({
            range: "max",
            min: 10,
            max: 60,
            step: 5,
            value: TARGET,
            slide: function (event, ui) {
                TARGET = ui.value;
                document.getElementById("lbl_target_val").textContent = ui.value;
                document.getElementById("lbl_total").textContent = "/ " + ui.value;
            },
            stop: function () { gameReload(); }
        });

        var speedLabels = ["Pomalá", "Střední", "Rychlá"];
        $("#slider_speed").slider({
            range: "max",
            min: 1,
            max: 3,
            step: 1,
            value: 2,
            slide: function (event, ui) {
                SPEED = ui.value;
                document.getElementById("lbl_speed_val").textContent = speedLabels[ui.value - 1];
            },
            stop: function () { gameReload(); }
        });

        /* ---------- start ---------- */
        resize();
        updateHud();
        draw();

        window.addEventListener("resize", function () { resize(); });
        window.addEventListener("orientationchange", function () {
            setTimeout(function () { resize(); }, 150);
        });

        if (window.ResizeObserver) {
            try { new ResizeObserver(function () { resize(); }).observe(board); } catch (e) {}
        }
    })();
    </script>
