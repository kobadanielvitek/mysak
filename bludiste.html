    <script>
    (function () {
        "use strict";

        var board = document.getElementById("board");
        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");

        var elMiss = document.getElementById("lbl_miss");
        var elBad = document.getElementById("box_bad");
        var elTime2 = document.getElementById("lbl_time2");
        var elStatus = document.getElementById("lbl_status");

        var wrong = 0;
        var won = false;
        var started = false;
        var W = 600, H = 600, DPR = 1;

        // bludiště
        var CELL = 0;
        var COLS = 0, ROWS = 0;
        var grid = [];   // grid[r][c] = {top,right,bottom,left}
        var startX = 0, startY = 0;
        var finishX = 0, finishY = 0;
        var player = { x: 0, y: 0 };
        var wallColor = "#1a1a2e";
        var pathColor = "#2a2a40";

        /* ---------- generování bludiště (recursive backtracking) ---------- */
        function generateMaze() {
            COLS = 15;
            ROWS = 15;
            CELL = Math.floor(Math.min(W, H) / (COLS + 1));
            var offX = (W - COLS * CELL) / 2;
            var offY = (H - ROWS * CELL) / 2;

            grid = [];
            for (var r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (var c = 0; c < COLS; c++) {
                    grid[r][c] = { top: true, right: true, bottom: true, left: true, visited: false };
                }
            }

            // DFS
            var stack = [];
            var cur = { r: 0, c: 0 };
            grid[0][0].visited = true;
            stack.push(cur);
            while (stack.length > 0) {
                var last = stack[stack.length - 1];
                var nbrs = [];
                var dirs = [
                    { dr: -1, dc: 0, wall: "top", opp: "bottom" },
                    { dr: 1, dc: 0, wall: "bottom", opp: "top" },
                    { dr: 0, dc: -1, wall: "left", opp: "right" },
                    { dr: 0, dc: 1, wall: "right", opp: "left" }
                ];
                for (var i = 0; i < dirs.length; i++) {
                    var d = dirs[i];
                    var nr = last.r + d.dr, nc = last.c + d.dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !grid[nr][nc].visited) {
                        nbrs.push({ dir: d, r: nr, c: nc });
                    }
                }
                if (nbrs.length === 0) {
                    stack.pop();
                } else {
                    var pick = nbrs[Math.floor(Math.random() * nbrs.length)];
                    grid[last.r][last.c][pick.dir.wall] = false;
                    grid[pick.r][pick.c][pick.dir.opp] = false;
                    grid[pick.r][pick.c].visited = true;
                    stack.push({ r: pick.r, c: pick.c });
                }
            }

            startX = offX + CELL / 2;
            startY = offY + CELL / 2;
            finishX = offX + (COLS - 0.5) * CELL;
            finishY = offY + (ROWS - 0.5) * CELL;
            player.x = startX;
            player.y = startY;
            window.__maze = { grid: grid, COLS: COLS, ROWS: ROWS, CELL: CELL, offX: offX, offY: offY };
        }

        /* ---------- kreslení ---------- */
        function draw() {
            ctx.fillStyle = "#0b0b14";
            ctx.fillRect(0, 0, W, H);

            var m = window.__maze;
            var cell = m.CELL, offX = m.offX, offY = m.offY;

            // cesty (světlejší)
            ctx.fillStyle = "#1a1a2e";
            for (var r = 0; r < m.ROWS; r++) {
                for (var c = 0; c < m.COLS; c++) {
                    ctx.fillRect(offX + c * cell + 2, offY + r * cell + 2, cell - 4, cell - 4);
                }
            }

            // zdi
            ctx.strokeStyle = "#4a4a6a";
            ctx.lineWidth = 4;
            ctx.lineCap = "square";
            for (var r = 0; r < m.ROWS; r++) {
                for (var c = 0; c < m.COLS; c++) {
                    var g = m.grid[r][c];
                    var x = offX + c * cell;
                    var y = offY + r * cell;
                    if (g.top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cell, y); ctx.stroke(); }
                    if (g.right) { ctx.beginPath(); ctx.moveTo(x + cell, y); ctx.lineTo(x + cell, y + cell); ctx.stroke(); }
                    if (g.bottom) { ctx.beginPath(); ctx.moveTo(x, y + cell); ctx.lineTo(x + cell, y + cell); ctx.stroke(); }
                    if (g.left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cell); ctx.stroke(); }
                }
            }

            // start
            ctx.fillStyle = "rgba(46,230,176,.25)";
            ctx.fillRect(offX + 4, offY + 4, cell - 8, cell - 8);
            ctx.fillStyle = "#2ee6b0";
            ctx.font = "bold 11px Google Sans, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("START", offX + cell / 2, offY + cell / 2);

            // cíl
            ctx.fillStyle = "rgba(139,124,255,.25)";
            ctx.fillRect(offX + (m.COLS - 1) * cell + 4, offY + (m.ROWS - 1) * cell + 4, cell - 8, cell - 8);
            ctx.fillStyle = "#8b7cff";
            ctx.fillText("CÍL", offX + (m.COLS - 0.5) * cell, offY + (m.ROWS - 0.5) * cell);

            // hráč
            if (!won) {
                ctx.fillStyle = "#ffd166";
                ctx.beginPath();
                ctx.arc(player.x, player.y, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        /* ---------- rozměry ---------- */
        function resize() {
            var rect = board.getBoundingClientRect();
            var cssW = Math.round(rect.width) || 600;
            var cssH = Math.round(rect.height) || cssW;
            W = Math.max(260, cssW);
            H = Math.max(260, cssH);
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            generateMaze();
            draw();
        }

        /* ---------- kolize se zdí (vzorkování pixelů) ---------- */
        function isWall(x, y) {
            var m = window.__maze;
            var cell = m.CELL, offX = m.offX, offY = m.offY;
            // hráč musí být uvnitř herní plochy
            if (x < offX || y < offY || x > offX + m.COLS * cell || y > offY + m.ROWS * cell) return true;
            var c = Math.floor((x - offX) / cell);
            var r = Math.floor((y - offY) / cell);
            if (c < 0 || c >= m.COLS || r < 0 || r >= m.ROWS) return true;
            var g = m.grid[r][c];
            var lx = x - (offX + c * cell);
            var ly = y - (offY + r * cell);
            var margin = 3;
            if (g.top && ly < margin) return true;
            if (g.bottom && ly > cell - margin) return true;
            if (g.left && lx < margin) return true;
            if (g.right && lx > cell - margin) return true;
            return false;
        }

        function resetPlayer() {
            var m = window.__maze;
            player.x = m.offX + m.CELL / 2;
            player.y = m.offY + m.CELL / 2;
            wrong++;
            elBad.textContent = wrong;
            elMiss.textContent = wrong;
            window.MYSAK_WRONG = wrong;
            if (window.kidSound) window.kidSound.bad();
            elStatus.textContent = "Narazil jsi do zdi – zpátky na start. Chyby: " + wrong;
        }

        /* ---------- pohyb myši ---------- */
        canvas.addEventListener("mousemove", function (e) {
            if (won) return;
            if (!started) {
                started = true;
                try { GlobalTimer.start(); } catch (err) {}
            }
            var rect = canvas.getBoundingClientRect();
            if (!rect.width) return;
            var x = (e.clientX - rect.left) * (W / rect.width);
            var y = (e.clientY - rect.top) * (H / rect.height);

            // zkontroluj kolizi v několika bodech kolem hráče
            var r = 6;
            var pts = [[0,0],[r,0],[-r,0],[0,r],[0,-r],[r*0.7,r*0.7],[-r*0.7,r*0.7],[r*0.7,-r*0.7],[-r*0.7,-r*0.7]];
            var hit = false;
            for (var i = 0; i < pts.length; i++) {
                if (isWall(x + pts[i][0], y + pts[i][1])) { hit = true; break; }
            }
            if (hit) {
                resetPlayer();
                draw();
                return;
            }
            player.x = x;
            player.y = y;

            // cíl?
            var m = window.__maze;
            var dx = player.x - (m.offX + (m.COLS - 0.5) * m.CELL);
            var dy = player.y - (m.offY + (m.ROWS - 0.5) * m.CELL);
            if (Math.sqrt(dx * dx + dy * dy) < m.CELL * 0.45) {
                win();
            }
            draw();
        });

        function win() {
            won = true;
            elStatus.textContent = "Vyhrál jsi! 🎉";
            if (window.kidSound) window.kidSound.win();
            try { GlobalTimer.stop(); } catch (e) {}
            if (typeof fin === "function") fin();
        }

        /* ---------- HUD ---------- */
        function updateHud() {
            elMiss.textContent = wrong;
            elBad.textContent = wrong;
            window.MYSAK_WRONG = wrong;
        }

        /* ---------- napojení ---------- */
        function checkSolution() { return won; }

        function gameReload() {
            wrong = 0;
            won = false;
            started = false;
            window.MYSAK_WRONG = 0;
            resize();
            elMiss.textContent = 0;
            elBad.textContent = 0;
            elStatus.textContent = "Vedej myší od STARTU k CÍLI, aniž bys narazil do zdi.";
            try { GlobalTimer.reset(); } catch (e) {}
        }

        function showHelp() {
            if (typeof popupWindow === "function") {
                popupWindow(document.getElementById("help").innerHTML, 430, 300);
            }
        }

        window.checkSolution = checkSolution;
        window.gameReload = gameReload;
        window.showHelp = showHelp;

        /* ---------- start ---------- */
        resize();
        updateHud();
        draw();

        window.addEventListener("resize", function () { resize(); });
        window.addEventListener("orientationchange", function () {
            setTimeout(function () { resize(); }, 150);
        });

        if (window.ResizeObserver) {
            try { new ResizeObserver(function () { resize(); }).observe(board); } catch (e) {}
        }
    })();
    </script>
